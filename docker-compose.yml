name: monitor-secure-pipeline

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alertmanager-data:

networks:
  msp:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Demo application services (OTel-instrumented)
  # ---------------------------------------------------------------------------
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - otelcol
    restart: unless-stopped
    networks:
      - msp

  user-service:
    build: ./services/user-service
    container_name: user-service
    expose:
      - "8001"
    depends_on:
      - otelcol
    restart: unless-stopped
    networks:
      - msp

  product-service:
    build: ./services/product-service
    container_name: product-service
    expose:
      - "8002"
    depends_on:
      - otelcol
    restart: unless-stopped
    networks:
      - msp

  order-service:
    build: ./services/order-service
    container_name: order-service
    expose:
      - "8003"
    depends_on:
      - otelcol
    restart: unless-stopped
    networks:
      - msp

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    expose:
      - "8004"
    depends_on:
      - otelcol
    restart: unless-stopped
    networks:
      - msp

  load-generator:
    build: ./load-generator
    container_name: load-generator
    depends_on:
      - api-gateway
      - otelcol
    restart: unless-stopped
    networks:
      - msp

  # ---------------------------------------------------------------------------
  # Telemetry receivers
  # ---------------------------------------------------------------------------
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otelcol
    expose:
      - "4317"
      - "4318"
    ports:
      - "8889:8889"
    volumes:
      - ./monitoring/otelcol/config.yml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped
    networks:
      - msp

  # ---------------------------------------------------------------------------
  # Observability backend
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    restart: unless-stopped
    networks:
      - msp

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    restart: unless-stopped
    networks:
      - msp

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    ports:
      - "3200:3200"
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml
      - tempo-data:/tmp/tempo
    user: root
    command:
      - '-config.file=/etc/tempo/tempo-config.yml'
    restart: unless-stopped
    networks:
      - msp

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/data
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    restart: unless-stopped
    networks:
      - msp

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - msp

  # ---------------------------------------------------------------------------
  # Infrastructure exporters
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    networks:
      - msp

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    expose:
      - "8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - msp

  # ---------------------------------------------------------------------------
  # Security observability: DefectDojo findings exporter
  # ---------------------------------------------------------------------------
  defectdojo-exporter:
    build: ./monitoring/exporters/defectdojo-exporter
    container_name: defectdojo-exporter
    expose:
      - "8081"
    environment:
      - DD_API_URL=${DD_API_URL:-http://defectdojo:8080}
      - DD_API_TOKEN=${DD_API_TOKEN:-}
      - SCRAPE_INTERVAL=30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - msp
